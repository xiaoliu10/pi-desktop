appId: com.pidesktop.app
productName: PI Desktop
directories:
  output: release
files:
  - dist/**/*
  - package.json
beforePack: scripts/check-runtime.cjs
extraResources:
  - from: resources/pi-runtime
    to: pi-runtime
    filter:
      - "**/*"
      - "!node_modules/.cache/**/*"
  - from: extensions/desktop-policy
    to: desktop-policy
  - from: extensions/desktop-ask
    to: desktop-ask
mac:
  category: public.app-category.developer-tools
  extendInfo:
    # 语音输入：麦克风用途说明（打包版需显式声明；dev 版 Electron 自带）
    NSMicrophoneUsageDescription: PI Desktop 需要麦克风权限以进行语音输入。
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  target:
    - AppImage
    - deb
  category: Development
