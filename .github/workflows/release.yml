name: Release

# 推送 v* 标签自动构建 mac/win 安装包并挂到对应 Release；
# 也支持手动触发（inputs.tag 指定要附加产物的既有标签）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要附加产物的 Release 标签'
        default: 'v0.0.1'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: --mac
          - os: windows-2022
            targets: --win nsis
    runs-on: ${{ matrix.os }}
    steps:
      # 标签推送构建标签代码；手动触发按 inputs.tag 检出对应标签（为旧 Release 补发产物），
      # workflow 本身始终用 main 上这份最新配置。
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # node-gyp 9 需要 distutils（Python 3.12 已移除）；3.11 自带，供 electron-builder 重编 node-pty
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare bundled pi runtime
        run: pnpm runtime:prepare

      - name: Build
        run: pnpm build

      # windows-2022 自带 VS2022（node-gyp 9 可识别）；setup-msbuild 保证 msbuild 在 PATH
      - uses: microsoft/setup-msbuild@v2
        if: runner.os == 'Windows'

      - name: Package
        run: npx electron-builder ${{ matrix.targets }} --publish never
        env:
          npm_config_msvs_version: '2022'
          GYP_MSVS_VERSION: '2022'

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.dmg
            dist/*.exe
