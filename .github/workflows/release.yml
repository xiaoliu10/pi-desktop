name: Release

# 推送 v* 标签自动构建 mac/win 安装包并挂到对应 Release；
# 也支持手动触发（inputs.tag 指定要附加产物的既有标签）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要附加产物的 Release 标签'
        default: 'v0.0.1'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: --mac
          - os: windows-latest
            targets: --win nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare bundled pi runtime
        run: pnpm runtime:prepare

      - name: Build
        run: pnpm build

      # node-gyp 9（electron-builder 重编 node-pty 用）需要 distutils，Python 3.12 已移除
      - name: Restore distutils for node-gyp (macOS Python 3.12+)
        if: runner.os == 'macOS'
        run: python3 -m pip install --user setuptools

      - uses: microsoft/setup-msbuild@v2
        if: runner.os == 'Windows'

      - name: Package
        run: npx electron-builder ${{ matrix.targets }} --publish never
        env:
          npm_config_msvs_version: '2022'
          GYP_MSVS_VERSION: '2022'

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/**/*.exe
            dist/**/*.dmg
